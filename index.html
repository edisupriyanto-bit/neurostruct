const list = document.getElementById('page-list');
const searchInput = document.getElementById('search');
const resultCount = document.getElementById('result-count');
const empty = document.getElementById('empty');

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]));
}
function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return esc(text).replace(re, '<mark>$1</mark>');
}

function renderList(q) {
  let html = '';
  let count = 0;
  pages.forEach((p, i) => {
    if (!q || p.title.toLowerCase().includes(q) || p.file.toLowerCase().includes(q)) {
      count++;
      // encodeURIComponent untuk handle koma, kurung, #, spasi, dll
      const href = encodeURIComponent(p.file).replace(/%2F/g, '/');
      html += '<li class="page-item"><a href="' + href + '" target="_blank">'
            + '<span class="item-num">' + String(i+1).padStart(3,'0') + '</span>'
            + '<span class="item-title">' + highlight(p.title, q) + '</span>'
            + '<span class="item-arrow">&#8594;</span>'
            + '</a></li>';
    }
  });
  list.innerHTML = html;
  resultCount.innerHTML = q
    ? 'Ditemukan <strong>' + count + '</strong> artikel untuk "<em>' + esc(q) + '</em>"'
    : 'Menampilkan <strong>' + count + '</strong> artikel';
  empty.style.display = count === 0 ? 'block' : 'none';
}

// Render awal
renderList('');

let debounce;
searchInput.addEventListener('input', function() {
  clearTimeout(debounce);
  debounce = setTimeout(() => renderList(searchInput.value.trim().toLowerCase()), 150);
});

window.addEventListener('scroll', () => {
  document.getElementById('topbtn').classList.toggle('visible', window.scrollY > 400);
});
</script>
